<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NoteGhor Admin</title><link rel="stylesheet" href="/style.css"></head><body><main class="section"><div id="login"><p class="eyebrow">NOTE GHOR ADMIN</p><h1>Control center</h1><form id="loginForm" style="max-width:420px;display:grid;gap:12px"><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password" required><button class="btn">Sign in</button></form><p class="muted">Change the default admin password using environment variables before going live.</p></div><div id="panel" class="hidden"><div class="section-head"><div><p class="eyebrow">ADMIN DASHBOARD</p><h2>Orders & resources</h2></div><button class="small-btn" onclick="logout()">Log out</button></div><div class="card" style="margin-bottom:25px"><h3>Upload resource</h3><form id="uploadForm" style="display:grid;gap:12px"><input name="title" placeholder="Title" required><input name="category" placeholder="Category (e.g. BCS, Academic)" required><input name="price" type="number" min="0" placeholder="Price (BDT)" required><textarea name="description" placeholder="Short description" rows="3"></textarea><input name="file" type="file" required><button class="btn">Upload & publish</button></form><div id="uploadMsg"></div></div><h3>Pending / recent orders</h3><div id="orders"></div><h3 style="margin-top:40px">Published resources</h3><div id="resources"></div></div></main><script>
async function login(e){e.preventDefault();let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});if(r.ok){document.getElementById('login').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');load()}else alert('Invalid login')}
document.getElementById('loginForm').onsubmit=login;
async function load(){let [o,p]=await Promise.all([fetch('/api/admin/orders'),fetch('/api/admin/products')]);if(o.status===401){location.reload();return} renderOrders(await o.json());renderProducts(await p.json())}
function renderOrders(a){document.getElementById('orders').innerHTML=a.length?a.map(o=>`<div class="card" style="margin:10px 0;min-height:auto"><b>${o.productTitle}</b><p>${o.name} · ${o.phone}<br>Method: ${o.paymentMethod} · TXN: <b>${o.transactionId}</b><br>Status: <b>${o.status}</b></p>${o.status==='pending'?`<button class="small-btn" onclick="status('${o.id}','approved')">Approve</button> <button class="small-btn" onclick="status('${o.id}','rejected')">Reject</button>`:''}${o.status==='approved'?`<p><a href="/api/download/${o.id}" target="_blank">Download link</a></p>`:''}</div>`).join(''):'<p>No orders yet.</p>'}
function renderProducts(a){document.getElementById('resources').innerHTML=a.map(p=>`<div class="card" style="margin:10px 0;min-height:auto"><b>${p.title}</b><p>৳${p.price} · ${p.category}</p><button class="small-btn" onclick="del('${p.id}')">Delete</button></div>`).join('')||'<p>No resources.</p>'}
async function status(id,status){await fetch('/api/admin/orders/'+id+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});load()}
async function del(id){if(confirm('Delete this resource?')){await fetch('/api/admin/products/'+id,{method:'DELETE'});load()}}
document.getElementById('uploadForm').onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/admin/products',{method:'POST',body:new FormData(e.target)});let x=await r.json();document.getElementById('uploadMsg').textContent=r.ok?'Uploaded successfully.':(x.error||'Upload failed');if(r.ok){e.target.reset();load()}}
async function logout(){await fetch('/api/admin/logout',{method:'POST'});location.reload()}
</script></body></html>
